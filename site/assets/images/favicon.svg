<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .fi-halo {
      transform-origin: 32px 32px;
      animation: fiHalo 2400ms ease-in-out infinite;
    }
    .fi-mark {
      transform-origin: 32px 32px;
      animation: fiPulse 2400ms ease-in-out infinite;
    }
    @keyframes fiHalo {
      0%, 100% { opacity: 0; r: 24px; }
      50% { opacity: .38; r: 29px; }
    }
    @keyframes fiPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fi-halo, .fi-mark { animation: none; }
    }
  </style>
  <circle class="fi-halo" cx="32" cy="32" r="24" fill="#67C5F8"></circle>
  <image class="fi-mark" href="data:image/png;base64," x="0" y="0" width="64" height="64"></image>
</svg>
