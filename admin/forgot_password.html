<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>
    <h1>Forgot Password</h1>
    <p class="sub">Enter your admin username or email and we'll send reset instructions.</p>

    <div class="flash-stack">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash-alert flash-{{ category }}">
          <span class="flash-icon" aria-hidden="true">
            {% if category == 'success' %}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {% else %}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5h.01M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {% endif %}
          </span>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>

    <form method="POST" action="/admin/forgot-password">
      <div class="field">
        <label for="identifier">Admin username or email</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Reset Link</button>
    </form>

    <p class="auth-foot"><a href="/admin/login">Back to sign in</a></p>
  </div>
</div>
</body>
</html>
