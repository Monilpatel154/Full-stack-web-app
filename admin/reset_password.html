<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>
    <h1>Reset Password</h1>
    <p class="sub">Choose a new password for your admin account.</p>

    <div class="flash-stack">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash-alert flash-{{ category }}">
          <span class="flash-icon" aria-hidden="true">
            {% if category == 'success' %}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {% else %}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5h.01M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {% endif %}
          </span>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>

    <form method="POST" action="/admin/reset-password/{{ token }}">
      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-field">
          <input id="new-password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <div class="password-field">
          <input id="confirm-password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <p class="sub" style="margin:-8px 0 14px">At least 8 characters.</p>
      <button class="btn btn-primary btn-block" type="submit">Update Password</button>
    </form>

    <p class="auth-foot"><a href="/admin/login">Back to sign in</a></p>
  </div>
</div>
<script src="/admin/assets/admin.js"></script>
<script>Admin.wirePasswordToggles();</script>
</body>
</html>
