<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>

<div class="topbar">
  <img src="/assets/images/ladli-logo.webp" alt="LADLI">
  <button id="sidebar-toggle" aria-label="Menu">&#9776;</button>
</div>  

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>

    <a class="side-link" href="/admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      Enquiries
    </a>
    <a class="side-link active" href="/admin/settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
    <a class="side-link" href="/admin/visitors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Visitor Management
    </a>
    <a class="side-link" href="/" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
      View Website
    </a>  

    <div class="sidebar-foot">
      <div class="sidebar-user"><strong id="sidebar-username">—</strong>Signed in</div>
      <a class="side-link" href="#" id="logout-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign Out
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Settings</h1>
        <p>Update your admin password. Do this immediately after your first login.</p>
      </div>
    </div>

    <div class="form-error is-visible" id="force-change-banner" style="display:none;max-width:440px">
      You're using a one-time generated password. You must set a new password before you can use the rest of the admin portal.
    </div>

    <div class="panel" style="max-width:440px;padding:26px 24px">
      <div class="form-error" id="pw-error"></div>
      <div class="form-success" id="pw-success"></div>
      <form id="pw-form">
        <div class="field">
          <label for="current-password">Current password</label>
          <div class="password-field">
            <input id="current-password" name="current_password" type="password" required autocomplete="current-password">
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <div class="password-field">
            <input id="new-password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <div class="password-field">
            <input id="confirm-password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <p class="sub" style="margin:-8px 0 14px">At least 8 characters.</p>
        <button class="btn btn-primary btn-block" type="submit" id="pw-btn">Update Password</button>
      </form>
    </div>
  </main>
</div>

<script src="/admin/assets/admin.js"></script>
<script>
let forcedChange = false;

async function boot() {
  const me = await Admin.requireAuth();
  if (!me) return;
  document.getElementById('sidebar-username').textContent = me.username;
  Admin.wireLogout(document.getElementById('logout-link'));
  Admin.wireMobileSidebar();
  Admin.wirePasswordToggles();
  document.getElementById('pw-form').addEventListener('submit', onSubmit);
  if (me.must_change_password) {
    forcedChange = true;
    document.getElementById('force-change-banner').style.display = 'block';
  }
}

async function onSubmit(e) {
  e.preventDefault();
  const errorEl = document.getElementById('pw-error');
  const successEl = document.getElementById('pw-success');
  errorEl.classList.remove('is-visible');
  successEl.classList.remove('is-visible');

  const current = document.getElementById('current-password').value;
  const next = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;

  if (next !== confirm) {
    errorEl.textContent = 'New password and confirmation do not match.';
    errorEl.classList.add('is-visible');
    return;
  }

  const btn = document.getElementById('pw-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await Admin.api('/api/admin/change-password', {
      method: 'POST',
      body: JSON.stringify({ current_password: current, new_password: next }),
    });
    successEl.textContent = 'Password updated successfully.';
    successEl.classList.add('is-visible');
    document.getElementById('pw-form').reset();
    // form.reset() restores values but not a dynamically-changed input
    // type, so explicitly put every toggled field back to hidden.
    document.querySelectorAll('#pw-form .password-field').forEach((wrapper) => {
      const fieldInput = wrapper.querySelector('input');
      const toggleBtn = wrapper.querySelector('.password-toggle');
      fieldInput.type = 'password';
      toggleBtn.classList.remove('is-visible');
      toggleBtn.setAttribute('aria-label', 'Show password');
    });
    if (forcedChange) {
      document.getElementById('force-change-banner').style.display = 'none';
      setTimeout(() => { window.location.href = '/admin'; }, 1200);
    }
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('is-visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Update Password';
  }
}

boot();
</script>
</body>
</html>
